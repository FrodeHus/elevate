name: Elevate
options:
  bundleIdPrefix: no.reothor
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ElevateCore:
    path: .
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: 2.15.0
targets:
  ElevateApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/ElevateApp
    dependencies:
      - package: ElevateCore
        product: ElevateCore
      - package: MSAL
        product: MSAL
    info:
      path: Sources/ElevateApp/Info.plist
      properties:
        CFBundleDisplayName: Elevate
        CFBundleName: Elevate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: no.reothor.elevate.auth
            CFBundleURLSchemes:
              - msauth.no.reothor.elevate
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
    entitlements:
      path: Sources/ElevateApp/Elevate.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)no.reothor.elevate
          - $(AppIdentifierPrefix)com.microsoft.identity.universalstorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.reothor.elevate
        PRODUCT_NAME: Elevate
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: VLJKN96D7N
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_APP_SANDBOX: false
        GENERATE_INFOPLIST_FILE: false
schemes:
  ElevateApp:
    build:
      targets:
        ElevateApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
