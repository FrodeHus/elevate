<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevate accounts and tenants sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Accounts and tenants" style="width: 136px; height: 780px; flex: none; box-sizing: border-box; padding: 10px 6px; display: flex; flex-direction: column; gap: 2px; background: {{bg}}; border-right: 1px solid rgba(255,255,255,0.08); color: #F5F5F7; font-family: {{font}}; font-size: 12px; line-height: 1.3">

<div style="display: flex; align-items: center; padding: 0 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #A1A1AA">
<span style="flex: 1">PROFILES</span>
<button style="border: 0; background: none; padding: 0; color: #C7C7CC; font: inherit; font-weight: 400; letter-spacing: 0; cursor: pointer">All 12</button>
</div>
<button style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border: 0; border-radius: {{r}}; background: rgba(255,255,255,0.07); color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#4C9BFF" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/></svg>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Morning ops</span>
</button>
<button style="display: flex; align-items: center; gap: 6px; height: 32px; margin-top: 2px; padding: 0 8px; border: 0; border-radius: {{r}}; background: {{selIncident}}; color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="{{boltIncident}}" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/></svg>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Incident response</span>
</button>
<button style="display: flex; align-items: center; gap: 6px; height: 32px; margin-top: 2px; padding: 0 8px; border: 0; border-radius: {{r}}; background: rgba(255,255,255,0.07); color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#4C9BFF" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/></svg>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Break glass</span>
</button>
<button style="display: flex; align-items: center; gap: 6px; height: 32px; margin-top: 2px; padding: 0 8px; border: 0; border-radius: {{r}}; background: rgba(255,255,255,0.07); color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#4C9BFF" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2l1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5z"/></svg>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Key Vault Administrator</span>
</button>

<div style="padding: 14px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #A1A1AA">TENANTS</div>
<button style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: {{r}}; background: {{selAll}}; color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<span style="flex: 1">All tenants</span>
<span style="color: #34D17A">3</span>
</button>

<div style="display: flex; align-items: center; gap: 4px; padding: 10px 8px 2px; font-size: 11px; color: #A1A1AA">
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">alex.rivera@contoso.com</span>
<button aria-label="Account menu for alex.rivera@contoso.com" style="display: flex; border: 0; background: none; padding: 0; color: #C7C7CC; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
</div>
<button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: {{r}}; background: {{selContoso}}; color: inherit; font: inherit; text-align: left; cursor: pointer">
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Contoso</span>
<span style="color: #34D17A">2</span>
</button>
<button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: {{r}}; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind Traders</span>
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#FF6B61" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Needs attention"><path d="M8 2.5 14 13H2zM8 7v3M8 11.5v.1"/></svg>
</button>
<button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: {{r}}; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Tailspin Toys</span>
</button>

<div style="display: flex; align-items: center; gap: 4px; padding: 10px 8px 2px; font-size: 11px; color: #A1A1AA">
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ops.rivera@fabrikam.com</span>
<button aria-label="Account menu for ops.rivera@fabrikam.com" style="display: flex; border: 0; background: none; padding: 0; color: #C7C7CC; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
</div>
<button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: {{r}}; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Fabrikam</span>
<span style="color: #34D17A">1</span>
</button>
<button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: {{r}}; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Tailspin Toys</span>
</button>

<div style="padding: 10px 8px 2px; font-size: 11px; color: #A1A1AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">admin@woodgrove.com</div>
<button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: {{r}}; background: rgba(245,158,61,0.16); color: #F5B53D; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5 14 13H2zM8 7v3M8 11.5v.1"/></svg>
<span style="flex: 1">Sign in</span>
</button>
<div style="display: flex; align-items: center; height: 28px; padding: 0 8px; color: #A1A1AA">Woodgrove Bank</div>

<span style="flex: 1"></span>
<button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: {{r}}; background: transparent; color: #C7C7CC; font: inherit; text-align: left; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
Add account…
</button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selected":{"editor":"enum","options":["all","contoso","incident"],"default":"all"},"win":{"editor":"boolean","default":false},"$preview":{"width":136,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const sel = this.props.selected ?? 'all';
const win = this.props.win ?? false;
const on = 'rgba(255,255,255,0.12)';
return {
bg: win ? '#1C1C1C' : '#18191B',
font: win ? "'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" : "-apple-system, system-ui, 'SF Pro Text', 'Segoe UI', sans-serif",
r: win ? '4px' : '7px',
selAll: sel === 'all' ? on : 'transparent',
selContoso: sel === 'contoso' ? on : 'transparent',
selIncident: sel === 'incident' ? '#0A6CDB' : 'rgba(255,255,255,0.07)',
boltIncident: sel === 'incident' ? '#FFFFFF' : '#4C9BFF'
};
}
}
</script>
</body>
</html>
