<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevate roles list in select mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input[type=checkbox]{margin:0;width:15px;height:15px;flex:none}
</style>
</helmet>
<div style="width: 516px; height: 780px; display: flex; background: #1E1F22">
<dc-import name="Rail" selected="all" hint-size="136px,780px"></dc-import>
<div style="width: 380px; height: 780px; box-sizing: border-box; display: flex; flex-direction: column; background: #1E1F22; color: #F5F5F7; font-family: -apple-system, system-ui, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.3">

<div style="padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08)">
<div style="display: flex; align-items: center; gap: 6px">
<a href="NowHome.dc.html" aria-label="Back to home" style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; color: #C7C7CC">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
</a>
<label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 9px; background: #2A2B2F">
<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
<input type="text" aria-label="Filter roles" placeholder="Filter roles" style="flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #F5F5F7; font: inherit; font-size: 14px">
</label>
<a href="NowSearch.dc.html" aria-label="Stop selecting" aria-pressed="true" style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; background: {{accentFill}}; color: #FFFFFF">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5l1.2 1.2 2-2.4M8.5 4.5h5M2.5 11l1.2 1.2 2-2.4M8.5 11.5h5"/></svg>
</a>
</div>
<div style="display: flex; padding: 2px; border-radius: 8px; background: #2A2B2F">
<button aria-pressed="true" style="flex: 1; height: 24px; border-radius: 6px; background: #4A4B52; font-weight: 600">All</button>
<button style="flex: 1; height: 24px; border-radius: 6px; color: #D4D4D8">Entra</button>
<button style="flex: 1; height: 24px; border-radius: 6px; color: #D4D4D8">Azure</button>
<button style="flex: 1; height: 24px; border-radius: 6px; color: #D4D4D8">Groups</button>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 6px 8px; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px; border-radius: 7px; background: #26272B">
<span style="font-weight: 600">Contoso</span><span style="font-size: 11px; color: #A1A1AA">home · alex.rivera@contoso.com</span>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px">
<input type="checkbox" checked style="accent-color: {{accent}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500">Exchange Administrator</span><span style="font-size: 11px; color: #A1A1AA">MFA</span></span>
</label>
<label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px">
<input type="checkbox" style="accent-color: {{accent}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500">Billing Administrator</span><span style="font-size: 11px; color: #A1A1AA">MFA</span></span>
</label>
<label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px">
<input type="checkbox" checked style="accent-color: {{accent}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500">Security Reader</span><span style="font-size: 11px; color: #A1A1AA">via IT Readers</span></span>
</label>
<label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; color: #A1A1AA">
<input type="checkbox" disabled>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500">User Administrator</span><span style="font-size: 11px">already active · 2 h 40 min</span></span>
</label>

<label style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; color: #D4D4D8">
<span role="img" aria-label="Partly selected" style="width: 15px; height: 15px; box-sizing: border-box; border-radius: 3px; background: {{accentFill}}; display: flex; align-items: center; justify-content: center; flex: none"><span style="width: 8px; height: 2px; background: #FFFFFF"></span></span>
<span style="font-size: 12px; font-weight: 600">Contoso Production</span><span style="font-size: 11px; color: #A1A1AA">Subscription · 2 roles</span>
</label>
<label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px 0 26px">
<input type="checkbox" checked style="accent-color: {{accent}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500">Key Vault Administrator</span><span style="font-size: 11px; color: #A1A1AA">approval · MFA</span></span>
</label>
<label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px 0 26px">
<input type="checkbox" style="accent-color: {{accent}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500">User Access Administrator</span><span style="font-size: 11px; color: #A1A1AA">MFA</span></span>
</label>

<div style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px; margin-top: 6px; border-radius: 7px; background: #26272B">
<span style="font-weight: 600">Fabrikam</span>
<span style="font-size: 11px; padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: #C7C7CC">Azure roles only</span>
<span style="font-size: 11px; color: #A1A1AA">ops.rivera@fabrikam.com</span>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px">
<input type="checkbox" style="accent-color: {{accent}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500">Contributor</span><span style="font-size: 11px; color: #A1A1AA">Fabrikam Dev · Subscription</span></span>
</label>
</div>

<div style="padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255,255,255,0.08); background: #232427">
<span style="font-size: 12px; color: #C7C7CC">3 selected · 2 Entra, 1 Azure</span>
<div style="display: flex; gap: 8px">
<button style="flex: 1; height: 28px; border-radius: 7px; background: rgba(255,255,255,0.1)">Save as profile…</button>
<button style="flex: 1; height: 28px; border-radius: 7px; background: {{accentFill}}; color: #FFFFFF; font-weight: 600">Activate 3 roles</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4C9BFF","options":["#4C9BFF","#B48CF2","#34D17A"]},"accentFill":{"editor":"color","default":"#0A6CDB","options":["#0A6CDB","#7A4FD1","#187A45"]},"$preview":{"width":516,"height":780}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#4C9BFF', accentFill: this.props.accentFill ?? '#0A6CDB' };
}
}
</script>
</body>
</html>
