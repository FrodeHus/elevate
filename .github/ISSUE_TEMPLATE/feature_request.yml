name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Elevate makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like Elevate to do
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Entra directory roles
        - Azure resource roles
        - PIM for Groups
        - Profiles and shortcuts
        - Approvals
        - Sign-in and accounts
        - Panel and notifications
        - Packaging, install or updates
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including anything you do manually today.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, links to Microsoft documentation, related issues.
