name: macOS

on:
  push:
    branches: [main]
    paths: ["macos/**", "shared/**", "Casks/**", ".github/workflows/macos.yml"]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Pull requests always run this workflow so its jobs exist as required status checks. This job
  # reads the diff and the real jobs skip when nothing relevant changed; a skipped job counts as
  # passing for a ruleset, whereas a workflow filtered out by `paths` never reports and leaves the
  # pull request stuck on a pending check. Pushes to main keep the path filter above.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(macos/|shared/|Casks/|\.github/workflows/macos\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  core-tests:
    name: ElevateCore tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test

  app-build:
    name: ElevateApp build and tests (unsigned)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        shell: bash
        run: >
          xcodebuild -project Elevate.xcodeproj -scheme ElevateApp -configuration Debug
          -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          build | tail -5
      - name: App tests
        shell: bash
        run: >
          xcodebuild -project Elevate.xcodeproj -scheme ElevateApp -configuration Debug
          -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          test | tail -30
