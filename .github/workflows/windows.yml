name: Windows

on:
  push:
    branches: ["main"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Restore
        run: dotnet restore windows/Elevate.sln

      - name: Build
        run: dotnet build windows/Elevate.sln --no-restore -c Release

      - name: Test
        run: dotnet test windows/Elevate.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
