name: Windows

on:
  push:
    branches: ["main"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Restore
        run: dotnet restore windows/Elevate.sln

      - name: Build
        run: dotnet build windows/Elevate.sln --no-restore -c Release

      - name: Test
        run: dotnet test windows/Elevate.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  release:
    name: Package and publish
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: test
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Version
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^windows-v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install WiX
        # v5: later majors require accepting the Open Source Maintenance Fee EULA.
        run: dotnet tool install --global wix --version 5.0.2

      - name: Detect signing secrets
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          if ($env:ENDPOINT) {
            "SIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "Azure Trusted Signing secrets not configured; publishing unsigned MSIs."
          }

      - name: Azure login for signing
        if: env.SIGN == '1'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Trusted Signing client
        if: env.SIGN == '1'
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory signing -ExcludeVersion
          $dlib = Get-ChildItem -Recurse signing -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          "AZURE_TRUSTED_SIGNING_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $signtool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build MSIs
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          $sign = $env:SIGN -eq '1'
          ./windows/installer/build.ps1 -Version $env:VERSION -Sign:$sign

      - name: winget manifest
        shell: pwsh
        run: |
          $x64 = (Get-Content "windows/installer/out/Elevate-$env:VERSION-x64.msi.sha256").Split(' ')[0]
          $arm64 = (Get-Content "windows/installer/out/Elevate-$env:VERSION-arm64.msi.sha256").Split(' ')[0]
          ./windows/winget/New-Manifest.ps1 -Version $env:VERSION -X64Sha256 $x64 -Arm64Sha256 $arm64 -Repository $env:GITHUB_REPOSITORY
          winget validate --manifest "windows/winget/manifests/r/Reothor/Elevate/$env:VERSION"

      - name: Release notes
        shell: pwsh
        run: |
          $x64 = (Get-Content "windows/installer/out/Elevate-$env:VERSION-x64.msi.sha256").Split(' ')[0]
          $arm64 = (Get-Content "windows/installer/out/Elevate-$env:VERSION-arm64.msi.sha256").Split(' ')[0]
          if ($env:SIGN -eq '1') {
            $signing = "Signed with Azure Artifact Signing."
          } else {
            $signing = "This build is not code-signed. Windows SmartScreen will show `"Windows protected your PC`" the first time you run the installer: choose **More info**, then **Run anyway**. Verify the download against the SHA-256 below first."
          }
          @"
          Elevate for Windows $env:VERSION.

          Download the MSI for your architecture below and run it. It installs for the current user (no admin rights) into %LOCALAPPDATA%\Programs\Elevate and needs the .NET 10 runtime: ``winget install Microsoft.DotNet.Runtime.10``.

          $signing

          SHA-256:
          - x64: $x64
          - arm64: $arm64

          To verify: ``(Get-FileHash .\Elevate-$env:VERSION-x64.msi).Hash``
          "@ | Set-Content -Path notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:TAG `
            "windows/installer/out/Elevate-$env:VERSION-x64.msi" `
            "windows/installer/out/Elevate-$env:VERSION-x64.msi.sha256" `
            "windows/installer/out/Elevate-$env:VERSION-arm64.msi" `
            "windows/installer/out/Elevate-$env:VERSION-arm64.msi.sha256" `
            --title "Elevate for Windows $env:VERSION" --notes-file notes.md

      # The manifest is kept as an artifact for a later submission to microsoft/winget-pkgs; winget
      # moderation requires signed installers, so nothing is submitted automatically.
      - name: Manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: windows/winget/manifests
