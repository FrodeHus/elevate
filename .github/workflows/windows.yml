name: Windows

on:
  push:
    branches: ["main"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:

permissions:
  contents: write

jobs:
  # Pull requests always run this workflow so its jobs exist as required status checks. This job
  # reads the diff and the real jobs skip when nothing relevant changed; a skipped job counts as
  # passing for a ruleset, whereas a workflow filtered out by `paths` never reports and leaves the
  # pull request stuck on a pending check. Pushes to main keep the path filter above.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(windows/|\.github/workflows/windows\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Restore
        run: dotnet restore windows/Elevate.sln

      - name: Build
        run: dotnet build windows/Elevate.sln --no-restore -c Release

      - name: Test
        run: dotnet test windows/Elevate.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
