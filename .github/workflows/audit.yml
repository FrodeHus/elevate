name: Audit

on:
  push:
    branches: ["main"]
    paths: ["audit/**", "windows/src/Elevate.Core/**", ".github/workflows/audit.yml"]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests always run this workflow so its jobs exist as required status checks. This job
  # reads the diff and the real jobs skip when nothing relevant changed; a skipped job counts as
  # passing for a ruleset, whereas a workflow filtered out by `paths` never reports and leaves the
  # pull request stuck on a pending check. Pushes to main keep the path filter above.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(audit/|windows/src/Elevate\.Core/|\.github/workflows/audit\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The auditor must run on Linux, macOS and Windows: the tests run on all three, and each runner
  # publishes the self-contained binary for its own platform and starts it once.
  test:
    name: Build and test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux, rid: linux-x64 }
          - { os: macos-latest, name: macos, rid: osx-arm64 }
          - { os: windows-latest, name: windows, rid: win-x64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: audit/global.json

      - name: Restore
        run: dotnet restore audit/Elevate.Audit.sln

      - name: Build
        run: dotnet build audit/Elevate.Audit.sln --no-restore -c Release

      - name: Test
        run: dotnet test audit/Elevate.Audit.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Publish and start the single-file binary
        shell: bash
        run: |
          ./audit/package.sh publish 0.0.0 "${{ matrix.rid }}"
          ./audit/package.sh archive 0.0.0 "${{ matrix.rid }}"
          exe="audit/dist/${{ matrix.rid }}/elevate-audit"; [ -f "$exe" ] || exe="$exe.exe"
          # Trimmed binary: exercise JSON both ways, the HTML renderer and the tables.
          "$exe" version
          "$exe" --from-snapshot audit/tests/Elevate.Audit.Tests/Fixtures/snapshots/sample.json --json - --quiet --no-fail | grep -q '"findings"'
          "$exe" --from-snapshot audit/tests/Elevate.Audit.Tests/Fixtures/snapshots/sample.json --html "$RUNNER_TEMP/sample.html" --no-color --no-fail | grep -q "ENTRA-USER-PERMANENT"
          grep -q "<!doctype html>" "$RUNNER_TEMP/sample.html"
          ls -la audit/dist/*.sha256

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-test-results-${{ matrix.name }}
          path: "**/TestResults/*.trx"
