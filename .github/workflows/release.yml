name: Release

# One tag, one release, every platform. Pushing `v<version>` builds the macOS DMG, the Windows
# MSIs and the CLI archives (Linux, macOS and Windows, x64 and arm64) from the same commit, then
# publishes a single GitHub Release "Elevate <version>" with every asset, the changelog section
# for that version and the install instructions, and commits the Homebrew cask and formula to
# main. The tagged commit must be on main and its CHANGELOG.md must already have the section for
# that version; the check job refuses anything else before a build starts.
#
# Running the workflow by hand with a version does the steps before the tag as well: it checks
# that main is green, moves the Unreleased changelog entries under the new version, commits that
# to main and pushes the tag. That tag push starts a second run of this workflow, which builds
# and publishes; the manual run ends after the tag. Both pushes use the RELEASE_DEPLOY_KEY deploy
# key, which the main ruleset lets bypass the pull-request requirement (the workflow token cannot,
# and a tag pushed with it would not trigger a run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.7 or v1.2.7"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    name: Cut changelog and tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Every tag is v<x.y.z>, so a version typed with the v is the natural mistake; accept both.
      - name: Check the version and the tag
        run: |
          # The typed input stays in $VERSION (an env var, never expanded into the script).
          if ! [[ "${VERSION#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be x.y.z or vx.y.z, got '$VERSION'"; exit 1
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi

      # "main is green": the latest run of each CI workflow on main must have finished and passed.
      # A workflow that has never run on main (path filters) is not held against it.
      - name: Check that main is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in macos.yml windows.yml cli.yml; do
            run="$(gh run list --workflow "$wf" --branch main --event push --limit 1 --json status,conclusion,headSha,url --jq '.[0]')"
            if [ -z "$run" ] || [ "$run" = "null" ]; then echo "$wf: no run on main yet"; continue; fi
            status="$(jq -r .status <<<"$run")"; conclusion="$(jq -r .conclusion <<<"$run")"; url="$(jq -r .url <<<"$run")"
            if [ "$status" != "completed" ]; then echo "::error::$wf is still $status on main: $url"; exit 1; fi
            if [ "$conclusion" != "success" ]; then echo "::error::$wf last ended with $conclusion on main: $url"; exit 1; fi
            echo "$wf: success ($(jq -r .headSha <<<"$run" | cut -c1-7))"
          done

      - name: Cut the changelog
        run: ./scripts/cut-changelog.sh "$VERSION" "$(date -u +%Y-%m-%d)" "${{ github.repository }}"

      - name: Configure the deploy key
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::RELEASE_DEPLOY_KEY is not set"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key && chmod 600 ~/.ssh/release_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          git remote set-url origin "git@github.com:${{ github.repository }}.git"

      - name: Commit the changelog and push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Changelog: $VERSION"
          git tag -a "v$VERSION" -m "Elevate $VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
          echo "Pushed v$VERSION; the tag run builds and publishes the release." >> "$GITHUB_STEP_SUMMARY"

  # Everything after this job signs and notarizes with the release certificates, publishes the
  # release and pushes to main with the deploy key, which bypasses the pull-request requirement.
  # Only a commit that already reached main through that requirement, carrying the changelog
  # section the manual run cuts, may get there; any other tag stops here before a build starts.
  check:
    name: Check the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is on main and has a changelog section
        run: |
          # fetch-depth 0 fetched every branch, so origin/main is already present.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main && rc=0 || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::$TAG points at $(git rev-parse --short "$GITHUB_SHA"), which is not on main; only tags on main are released"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::git merge-base failed with status $rc"; exit "$rc"
          fi
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md at $TAG has no \"## [${TAG#v}]\" section; run scripts/cut-changelog.sh first"
            exit 1
          fi

  macos:
    name: macOS app
    if: github.event_name == 'push'
    needs: check
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      pkg_signed: ${{ steps.installer.outputs.pkg_signed }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Versions
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Detect signing secrets
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$P12" ]; then
            echo "HAVE_CERT=1" >> "$GITHUB_ENV"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "Developer ID secrets not configured; building an ad-hoc signed release."
            echo "signed=" >> "$GITHUB_OUTPUT"
          fi

      # A Developer ID *Installer* certificate is a different certificate from the Developer ID
      # Application one above, and optional on its own: without it the pkg is still built, just
      # unsigned. Detected here for the same reason as the other one — the `secrets` context is
      # not available in an `if:` expression, and the value stays out of every expression.
      - name: Detect installer signing secrets
        id: installer
        env:
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
        run: |
          if [ -n "$INSTALLER_P12" ]; then
            echo "HAVE_INSTALLER_CERT=1" >> "$GITHUB_ENV"
            echo "pkg_signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "Developer ID Installer secrets not configured; publishing an unsigned pkg."
            echo "pkg_signed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate project
        run: xcodegen generate

      # The CLI ships inside the pkg copy of the app (Contents/Helpers/elevate), Apple Silicon
      # only; Intel Macs use the standalone archive the cli job builds. Published here rather
      # than pulled from the cli job so the two jobs stay parallel.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: cli/global.json

      - name: Publish the CLI helper
        run: |
          ../cli/package.sh publish "$VERSION" osx-arm64
          out="$(../cli/dist/osx-arm64/elevate --version)"
          test "$out" = "$VERSION" || { echo "::error::elevate --version printed '$out', expected '$VERSION'"; exit 1; }

      - name: Import Developer ID certificate
        if: env.HAVE_CERT == '1'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm -f cert.p12
          test -n "$PROFILE" || { echo "MACOS_PROVISIONING_PROFILE secret missing (Developer ID apps with keychain sharing need a provisioning profile)"; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > profile.provisionprofile
          UUID=$(security cms -D -i profile.provisionprofile | plutil -extract UUID raw -)
          NAME=$(security cms -D -i profile.provisionprofile | plutil -extract Name raw -)
          mv profile.provisionprofile "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.provisionprofile"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      # Built once with signing off; signed below, per path. Xcode cannot sign with an
      # Xcode-managed Developer ID profile in manual mode, and a PROVISIONING_PROFILE_SPECIFIER on
      # the command line leaks into the Swift package targets, so signing is done with codesign
      # the way an Xcode "Developer ID" export does.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Elevate.xcodeproj -scheme ElevateApp -configuration Release -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build | tail -5
          echo "APP=build/Build/Products/Release/Elevate.app" >> "$GITHUB_ENV"
          echo "PKG_APP=build/pkgroot/Elevate.app" >> "$GITHUB_ENV"

      # Two copies of the app: the DMG gets the app alone, the pkg gets the app with the CLI in
      # Contents/Helpers. A signature seals nested code, so the helper cannot be added or removed
      # after signing.
      - name: Embed the CLI helper in the pkg copy
        run: |
          rm -rf build/pkgroot && mkdir -p build/pkgroot
          cp -R "$APP" "$PKG_APP"
          mkdir -p "$PKG_APP/Contents/Helpers"
          cp ../cli/dist/osx-arm64/elevate "$PKG_APP/Contents/Helpers/elevate"
          chmod 755 "$PKG_APP/Contents/Helpers/elevate"
          test ! -e "$APP/Contents/Helpers"

      - name: Sign (Developer ID)
        if: env.SIGNED == '1'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "APPLE_TEAM_ID secret missing"; exit 1; }
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")
          cat > entitlements.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.application-identifier</key><string>$APPLE_TEAM_ID.$BUNDLE_ID</string>
          <key>com.apple.developer.team-identifier</key><string>$APPLE_TEAM_ID</string>
          <key>keychain-access-groups</key><array>
          <string>$APPLE_TEAM_ID.$BUNDLE_ID</string>
          <string>$APPLE_TEAM_ID.com.microsoft.identity.universalstorage</string>
          </array>
          </dict></plist>
          EOF
          # Inside-out, never --deep: frameworks, then the helper with the .NET host entitlements,
          # then each app bundle with its own entitlements and the embedded profile.
          for app in "$APP" "$PKG_APP"; do
            cp "$HOME/Library/MobileDevice/Provisioning Profiles/"*.provisionprofile "$app/Contents/embedded.provisionprofile"
            for fw in "$app"/Contents/Frameworks/*.framework; do
              [ -d "$fw" ] && codesign --force --options runtime --timestamp -s "Developer ID Application" "$fw"
            done
            if [ -f "$app/Contents/Helpers/elevate" ]; then
              codesign --force --options runtime --timestamp --entitlements ../cli/elevate.entitlements -s "Developer ID Application" "$app/Contents/Helpers/elevate"
              codesign -d --entitlements :- "$app/Contents/Helpers/elevate" | grep -q com.apple.security.cs.allow-jit
            fi
            codesign --force --options runtime --timestamp --entitlements entitlements.plist -s "Developer ID Application" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | grep -E "Authority=Developer ID Application|TeamIdentifier"
            codesign -d --entitlements :- "$app" | grep -q keychain-access-groups
          done

      - name: Sign (ad-hoc)
        if: env.SIGNED != '1'
        run: |
          codesign --force --deep -s - "$APP"
          codesign --force --deep -s - "$PKG_APP"

      # The helper must run under the hardened runtime with the entitlements above, and report
      # the same version the app's About shows; both are checked after signing, on the runner.
      - name: Check versions
        run: |
          app_version=$(plutil -extract CFBundleShortVersionString raw "$PKG_APP/Contents/Info.plist")
          cli_version=$("$PKG_APP/Contents/Helpers/elevate" --version)
          echo "app $app_version, cli $cli_version, tag $VERSION"
          test "$app_version" = "$VERSION" && test "$cli_version" = "$VERSION"

      - name: Notarize
        if: env.SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          for app in "$APP" "$PKG_APP"; do
            rm -f notarize.zip
            ditto -c -k --keepParent "$app" notarize.zip
            xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait | tee submit.txt
            id=$(awk '/^ *id:/ { print $2; exit }' submit.txt)
            test -n "$id" || { echo "::error::no submission id in notarytool output"; exit 1; }
            # The log lists every file the notary service examined; with the helper inside the
            # pkg copy it must come back Accepted with no issues.
            log="notarization-$(basename "$(dirname "$app")").json"
            # The log endpoint can lag the --wait result by a few seconds; retry before giving up.
            for attempt in 1 2 3 4 5; do
              if xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" > "$log"; then break; fi
              [ "$attempt" -lt 5 ] || { echo "::error::could not fetch the notarization log for $id"; exit 1; }
              sleep 10
            done
            cat "$log"
            grep -q '"status": "Accepted"' "$log"
            xcrun stapler staple "$app"
          done

      - name: Package DMG
        run: |
          rm -rf dist && mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Elevate" -srcfolder dist/dmg -ov -format UDZO "dist/Elevate-$VERSION.dmg"
          if [ "$SIGNED" = "1" ]; then
            codesign --force --timestamp -s "Developer ID Application" "dist/Elevate-$VERSION.dmg"
          fi

      - name: Notarize DMG
        if: env.SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/Elevate-$VERSION.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Elevate-$VERSION.dmg"

      # After stapling: the ticket changes the DMG's bytes, so the checksum must come last.
      - name: Checksum DMG
        run: shasum -a 256 "dist/Elevate-$VERSION.dmg" | tee "dist/Elevate-$VERSION.dmg.sha256"

      # `pkgbuild` itself needs no keychain, so the installer certificate is imported on its own,
      # into the same temporary build.keychain the application certificate uses — created here
      # when the unsigned build path skipped that step.
      - name: Import Developer ID Installer certificate
        if: env.HAVE_INSTALLER_CERT == '1'
        env:
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          echo "$INSTALLER_P12" | base64 --decode > installer.p12
          if ! security list-keychains -d user | grep -q build.keychain; then
            security create-keychain -p ci build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security default-keychain -s build.keychain
            security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          fi
          security unlock-keychain -p ci build.keychain
          security import installer.p12 -k build.keychain -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm -f installer.p12
          echo "PKG_SIGNED=1" >> "$GITHUB_ENV"

      # The pkg is what Jamf and Intune deploy; `installer -pkg` takes it too. Intune only accepts
      # a signed one, which is why the unsigned path says so in the release notes. This copy of
      # the app carries the CLI in Contents/Helpers; the postinstall script links it to
      # /usr/local/bin/elevate.
      - name: Package pkg
        run: |
          pkgbuild --root build/pkgroot --component-plist pkg/component.plist --install-location /Applications \
            --scripts pkg/scripts --identifier no.reothor.elevate --version "$VERSION" "dist/Elevate-$VERSION-unsigned.pkg"
          pkgutil --expand "dist/Elevate-$VERSION-unsigned.pkg" build/pkg-expanded
          test -x build/pkg-expanded/Scripts/postinstall
          rm -rf build/pkg-expanded
          if [ "$PKG_SIGNED" = "1" ]; then
            productsign --sign "Developer ID Installer" --timestamp \
              "dist/Elevate-$VERSION-unsigned.pkg" "dist/Elevate-$VERSION.pkg"
            pkgutil --check-signature "dist/Elevate-$VERSION.pkg"
          else
            cp "dist/Elevate-$VERSION-unsigned.pkg" "dist/Elevate-$VERSION.pkg"
          fi
          rm -f "dist/Elevate-$VERSION-unsigned.pkg"

      - name: Notarize pkg
        if: env.PKG_SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::warning::Notarization secrets are not set; shipping a signed but un-notarized pkg."
            exit 0
          fi
          xcrun notarytool submit "dist/Elevate-$VERSION.pkg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Elevate-$VERSION.pkg"

      # After stapling, like the DMG: the ticket changes the file's bytes.
      - name: Checksum pkg
        run: shasum -a 256 "dist/Elevate-$VERSION.pkg" | tee "dist/Elevate-$VERSION.pkg.sha256"

      - name: Upload DMG and pkg
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            macos/dist/Elevate-*.dmg
            macos/dist/Elevate-*.dmg.sha256
            macos/dist/Elevate-*.pkg
            macos/dist/Elevate-*.pkg.sha256
          if-no-files-found: error

  windows:
    name: Windows app
    if: github.event_name == 'push'
    needs: check
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Version
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: dotnet test windows/Elevate.sln -c Release

      - name: Install WiX
        # v5: later majors require accepting the Open Source Maintenance Fee EULA.
        run: dotnet tool install --global wix --version 5.0.2

      - name: Detect signing secrets
        id: signing
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          if ($env:ENDPOINT) {
            "SIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            "signed=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Azure Trusted Signing secrets not configured; publishing unsigned MSIs."
            "signed=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Azure login for signing
        if: env.SIGN == '1'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Trusted Signing client
        if: env.SIGN == '1'
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory signing -ExcludeVersion
          $dlib = Get-ChildItem -Recurse signing -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          "AZURE_TRUSTED_SIGNING_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $signtool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build MSIs
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          $sign = $env:SIGN -eq '1'
          ./windows/installer/build.ps1 -Version $env:VERSION -Sign:$sign

      - name: winget manifest
        shell: pwsh
        run: |
          $x64 = (Get-Content "windows/installer/out/Elevate-$env:VERSION-x64.msi.sha256").Split(' ')[0]
          $arm64 = (Get-Content "windows/installer/out/Elevate-$env:VERSION-arm64.msi.sha256").Split(' ')[0]
          ./windows/winget/New-Manifest.ps1 -Version $env:VERSION -X64Sha256 $x64 -Arm64Sha256 $arm64 -Repository $env:GITHUB_REPOSITORY
          winget validate --manifest "windows/winget/manifests/r/Reothor/Elevate/$env:VERSION"

      - name: Upload MSIs
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            windows/installer/out/Elevate-*.msi
            windows/installer/out/Elevate-*.msi.sha256
          if-no-files-found: error

      # The manifest is kept as an artifact for a later submission to microsoft/winget-pkgs; winget
      # moderation requires signed installers, so nothing is submitted automatically.
      - name: Manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifest
          path: windows/winget/manifests

  # The CLI: one self-contained single-file binary per platform, built on that platform's runner
  # so the macOS and Windows binaries can be signed with the same secrets as the apps (a plain
  # `dotnet publish` could cross-compile all six from one machine, but not sign them). Each
  # archive holds just the executable; the .sha256 next to it feeds the formula and the manifest.
  cli:
    name: CLI (${{ matrix.name }})
    if: github.event_name == 'push'
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux, rids: "linux-x64 linux-arm64" }
          - { os: macos-26, name: macos, rids: "osx-arm64 osx-x64" }
          - { os: windows-latest, name: windows, rids: "win-x64 win-arm64" }
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: cli/global.json

      - name: Version
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test cli/Elevate.Cli.sln -c Release

      - name: Publish
        shell: bash
        run: |
          for rid in ${{ matrix.rids }}; do
            ./cli/package.sh publish "$VERSION" "$rid"
          done

      # macOS: Developer ID signature with hardened runtime and a notarization ticket, the same
      # secrets as the app. A bare binary cannot be stapled; Gatekeeper checks the ticket online.
      - name: Detect macOS signing secrets
        if: matrix.name == 'macos'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$P12" ]; then echo "HAVE_CERT=1" >> "$GITHUB_ENV"; else echo "Developer ID secrets not configured; publishing unsigned macOS binaries."; fi

      - name: Sign and notarize (macOS)
        if: matrix.name == 'macos' && env.HAVE_CERT == '1'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm -f cert.p12
          for rid in ${{ matrix.rids }}; do
            bin="cli/dist/$rid/elevate"
            codesign --force --options runtime --timestamp --entitlements cli/elevate.entitlements -s "Developer ID Application" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            ditto -c -k --keepParent "$bin" "notarize-$rid.zip"
            xcrun notarytool submit "notarize-$rid.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            rm -f "notarize-$rid.zip"
          done

      # Windows: Azure Artifact Signing, the same secrets and client as the MSIs.
      - name: Detect Windows signing secrets
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          if ($env:ENDPOINT) { "SIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append } else { Write-Host "Azure Trusted Signing secrets not configured; publishing unsigned Windows binaries." }

      - name: Azure login for signing
        if: matrix.name == 'windows' && env.SIGN == '1'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign (Windows)
        if: matrix.name == 'windows' && env.SIGN == '1'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory signing -ExcludeVersion
          $dlib = Get-ChildItem -Recurse signing -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $metadata = Join-Path $env:RUNNER_TEMP "signing.json"
          @{ Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT; CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT; CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_PROFILE } | ConvertTo-Json | Set-Content $metadata
          foreach ($rid in "${{ matrix.rids }}".Split(' ')) {
            & $signtool.FullName sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $dlib.FullName /dmdf $metadata "cli/dist/$rid/elevate.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $rid" }
          }

      - name: Archive
        shell: bash
        run: |
          for rid in ${{ matrix.rids }}; do
            ./cli/package.sh archive "$VERSION" "$rid"
          done
          ls -la cli/dist

      - name: winget manifest (CLI)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $x64 = (Get-Content "cli/dist/elevate-cli-$env:VERSION-win-x64.zip.sha256").Split(' ')[0]
          $arm64 = (Get-Content "cli/dist/elevate-cli-$env:VERSION-win-arm64.zip.sha256").Split(' ')[0]
          ./cli/winget/New-Manifest.ps1 -Version $env:VERSION -X64Sha256 $x64 -Arm64Sha256 $arm64 -Repository $env:GITHUB_REPOSITORY
          winget validate --manifest "cli/winget/manifests/r/Reothor/Elevate.CLI/$env:VERSION"

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.name }}
          path: |
            cli/dist/elevate-cli-*.tar.gz
            cli/dist/elevate-cli-*.zip
            cli/dist/elevate-cli-*.sha256
          if-no-files-found: error

      # Like the app's manifest: kept as an artifact until releases are signed, then submitted by hand.
      - name: Manifest artifact (CLI)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: winget-cli-manifest
          path: cli/winget/manifests

  publish:
    name: Publish release
    needs: [macos, windows, cli]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      MAC_SIGNED: ${{ needs.macos.outputs.signed }}
      MAC_PKG_SIGNED: ${{ needs.macos.outputs.pkg_signed }}
      WIN_SIGNED: ${{ needs.windows.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Versions and hashes
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "DMG_SHA256=$(cut -d' ' -f1 "dist/Elevate-${TAG#v}.dmg.sha256")" >> "$GITHUB_ENV"
          echo "PKG_SHA256=$(cut -d' ' -f1 "dist/Elevate-${TAG#v}.pkg.sha256")" >> "$GITHUB_ENV"
          echo "X64_SHA256=$(cut -d' ' -f1 "dist/Elevate-${TAG#v}-x64.msi.sha256")" >> "$GITHUB_ENV"
          echo "ARM64_SHA256=$(cut -d' ' -f1 "dist/Elevate-${TAG#v}-arm64.msi.sha256")" >> "$GITHUB_ENV"
          # One checksums file for the six CLI archives, the usual shape for `sha256sum -c`.
          (cd dist && for f in elevate-cli-*.sha256; do printf '%s  %s\n' "$(cut -d' ' -f1 "$f")" "${f%.sha256}"; done) > "dist/elevate-cli-${TAG#v}-checksums.txt"
          cat "dist/elevate-cli-${TAG#v}-checksums.txt"

      # The kit is text from the checkout, not a build artifact; the release only stamps the
      # version into its README. The validator runs first so a kit that drifted from
      # docs/enterprise/keys.md fails the release instead of shipping.
      - name: Enterprise kit
        run: |
          python3 scripts/validate-enterprise-kit.py
          KIT=Elevate-enterprise-kit-$VERSION
          mkdir -p "dist/$KIT"
          cp -R enterprise/. "dist/$KIT/"
          cp docs/enterprise/keys.md "dist/$KIT/keys.md"
          sed -i "s/{{VERSION}}/$VERSION/g" "dist/$KIT/README.md"
          (cd dist && zip -r "$KIT.zip" "$KIT" && shasum -a 256 "$KIT.zip" > "$KIT.zip.sha256")
          echo "KIT_SHA256=$(cut -d' ' -f1 "dist/$KIT.zip.sha256")" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          {
            # The changelog section for this version, when there is one.
            awk -v v="$VERSION" '
              /^## \[/ { on = (index($0, "## [" v "]") == 1); if (on) { next } }
              on { print }
            ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo
            echo "## macOS"
            echo
            if [ "$MAC_SIGNED" = "1" ]; then
              echo "Signed with Developer ID and notarized."
            else
              echo 'Unsigned build (ad-hoc signature). Open the app once; when macOS blocks it, open System Settings -> Privacy & Security, scroll to the message about Elevate and click Open Anyway, then confirm. Or run `xattr -d com.apple.quarantine /Applications/Elevate.app`.'
            fi
            echo
            echo 'Install with Homebrew (the fully qualified cask name is required: this tap is not a homebrew- named repository):'
            echo
            echo '    brew tap FrodeHus/elevate https://github.com/FrodeHus/elevate'
            echo '    brew trust frodehus/elevate'
            echo '    brew install --cask frodehus/elevate/elevate'
            echo
            echo 'The cask installs the pkg (Homebrew asks for your password), which also puts the `elevate` CLI on your PATH.'
            echo
            echo "Or download \`Elevate-$VERSION.dmg\` below and drag Elevate to Applications. SHA-256: \`$DMG_SHA256\` The DMG is the app alone."
            echo
            echo "## Windows"
            echo
            echo "Download the MSI for your architecture below and run it. It installs for the current user (no admin rights) into %LOCALAPPDATA%\\Programs\\Elevate and needs the .NET 10 runtime: \`winget install Microsoft.DotNet.Runtime.10\`."
            echo
            if [ "$WIN_SIGNED" = "1" ]; then
              echo "Signed with Azure Artifact Signing."
            else
              echo 'This build is not code-signed. Windows SmartScreen shows "Windows protected your PC" the first time you run the installer: choose **More info**, then **Run anyway**. Verify the download against the SHA-256 first with `(Get-FileHash .\Elevate-'"$VERSION"'-x64.msi).Hash`.'
            fi
            echo
            echo "SHA-256:"
            echo "- x64: \`$X64_SHA256\`"
            echo "- arm64: \`$ARM64_SHA256\`"
            echo
            echo "## CLI (Linux, macOS, Windows)"
            echo
            echo 'One self-contained `elevate` binary per platform, no runtime to install.'
            echo
            echo 'macOS (Apple Silicon): the CLI is installed with the app by the Homebrew cask above or by `Elevate-'"$VERSION"'.pkg`, as `/usr/local/bin/elevate`. The `elevate-cli` formula is deprecated and will be removed in a later release; it still installs on Linux and Intel Macs:'
            echo
            echo '    brew install frodehus/elevate/elevate-cli'
            echo
            echo 'Windows: `Elevate-'"$VERSION"'-x64.msi` (or `-arm64.msi`) installs `elevate.exe` in a `cli` folder under the app and adds that folder to your PATH. Standalone: `winget install Reothor.Elevate.CLI` once the manifest is submitted; until then download `elevate-cli-'"$VERSION"'-win-x64.zip` (or `-win-arm64.zip`) below and put `elevate.exe` on your PATH.'
            echo
            echo 'Or download the archive for your platform below and unpack it anywhere on your PATH. Verify with `sha256sum -c elevate-cli-'"$VERSION"'-checksums.txt`. See [cli/README.md](https://github.com/'"${{ github.repository }}"'/blob/main/cli/README.md).'
            if [ "$MAC_SIGNED" != "1" ]; then
              echo
              echo 'The macOS binary is not signed; if Gatekeeper blocks a browser download, run `xattr -d com.apple.quarantine elevate`. Homebrew downloads carry no quarantine flag.'
            fi
            echo
            echo "## Enterprise"
            echo
            if [ "$MAC_PKG_SIGNED" = "1" ]; then
              echo "\`Elevate-$VERSION.pkg\` is a macOS installer package, and installs the \`elevate\` CLI (\`/usr/local/bin/elevate\`, Apple Silicon), signed with Developer ID Installer and notarized, for Jamf, Intune and \`sudo installer -pkg Elevate-$VERSION.pkg -target /\`. SHA-256: \`$PKG_SHA256\`"
            else
              echo "\`Elevate-$VERSION.pkg\` is a macOS installer package, and installs the \`elevate\` CLI (\`/usr/local/bin/elevate\`, Apple Silicon). It is **unsigned**: Jamf and \`sudo installer -pkg Elevate-$VERSION.pkg -target /\` accept it, Intune requires a signed pkg. SHA-256: \`$PKG_SHA256\`"
            fi
            echo
            echo "\`Elevate-enterprise-kit-$VERSION.zip\` holds the managed configuration templates: the \`Elevate.admx\`/\`Elevate.adml\` policy definitions and a \`.reg\` file for Windows, a mobileconfig, an Intune preference file and a Jamf manifest for macOS, a \`managed.json\` template for the CLI, the worked example and \`keys.md\`, the key reference. SHA-256: \`$KIT_SHA256\`"
            echo
            echo 'Deploying Elevate to a fleet starts at [docs/enterprise/README.md](https://github.com/'"${{ github.repository }}"'/blob/main/docs/enterprise/README.md).'
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG"
          "dist/Elevate-$VERSION.dmg"
          "dist/Elevate-$VERSION.dmg.sha256"
          "dist/Elevate-$VERSION.pkg"
          "dist/Elevate-$VERSION.pkg.sha256"
          "dist/Elevate-$VERSION-x64.msi"
          "dist/Elevate-$VERSION-x64.msi.sha256"
          "dist/Elevate-$VERSION-arm64.msi"
          "dist/Elevate-$VERSION-arm64.msi.sha256"
          dist/elevate-cli-$VERSION-*.tar.gz
          dist/elevate-cli-$VERSION-*.zip
          dist/elevate-cli-$VERSION-*.sha256
          "dist/elevate-cli-$VERSION-checksums.txt"
          "dist/Elevate-enterprise-kit-$VERSION.zip"
          "dist/Elevate-enterprise-kit-$VERSION.zip.sha256"
          --title "Elevate $VERSION" --notes-file notes.md

      - name: Configure the deploy key
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::RELEASE_DEPLOY_KEY is not set"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key && chmod 600 ~/.ssh/release_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          git remote set-url origin "git@github.com:${{ github.repository }}.git"

      # The deploy key bypasses the pull-request requirement on main, so the cask and the CLI
      # formula land directly, in one commit. The cask now installs the pkg (app + CLI), so it
      # is regenerated from the pkg hash rather than the DMG's. A retry covers a commit that
      # reached main while this run was building.
      - name: Update the cask and the formula on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B release-cask origin/main
            ./scripts/update-cask.sh "$VERSION" "$PKG_SHA256" "${{ github.repository }}" "${MAC_SIGNED:-}"
            ./scripts/update-formula.sh "$VERSION" "${{ github.repository }}" dist
            if git diff --quiet -- Casks/elevate.rb Formula/elevate-cli.rb; then
              echo "Cask and formula already up to date."
              exit 0
            fi
            git add Casks/elevate.rb Formula/elevate-cli.rb
            git commit -m "Cask and formula: Elevate $VERSION"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); refetching main."
          done
          echo "::error::Could not push the cask and formula update to main"; exit 1
